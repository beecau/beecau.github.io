<!DOCTYPE html>
<html>
<head>
    <title>Server</title>
</head>
<body>

    <h1>HTTP/1.1 Server</h1>
    <p id="status">Registering server...</p>

    <div id="controls" style="display: none;">
        <button onclick="testRoute('/api/status')">Fetch /api/status</button>
        <button onclick="testRoute('/api/hello')">Fetch /api/hello</button>
        <pre id="log">Waiting for request...</pre>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(() => {
                    document.getElementById('status').innerText = "Server Active!";
                    document.getElementById('controls').style.display = "block";
                })
                .catch((err) => {
                    document.getElementById('status').innerText = "Error: " + err;
                });
        } else {
            document.getElementById('status').innerText = "Service workers unsupported.";
        }

        async function testRoute(path) {
            const logEl = document.getElementById('log');
            logEl.innerText = "Sending request...";
            try {
                const response = await fetch(path);
                const text = await response.text();
                logEl.innerText = `HTTP/1.1 ${response.status}\n\n${text}`;
            } catch (err) {
                logEl.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
