<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Indonesia Economy Watch</title>
</head>
<body>
    <pre id="terminal">Initializing...</pre>
    <script>
        let isRunning = false;

        async function typeWriter(element, lines, speed = 10) {
            element.textContent = "";
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                for (let j = 0; j < line.length; j++) {
                    element.textContent += line[j];
                    await new Promise(resolve => setTimeout(resolve, speed));
                }
                element.textContent += "\n";
            }
        }

        async function fetchWithTimeout(url, options = {}, timeout = 4000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                if (!response.ok) throw new Error("HTTP error " + response.status);
                return response;
            } catch (e) {
                clearTimeout(id);
                throw e;
            }
        }

        // List of multiple public CORS proxies to fallback on
        async function fetchWithProxies(targetUrl) {
            const proxies = [
                url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
                url => "https://api.cors.lol/?url=" + encodeURIComponent(url),
                url => "https://corsproxy.io/?=" + encodeURIComponent(url),
                url => "https://thingproxy.freeboard.io/fetch/" + targetUrl
            ];

            for (let getProxyUrl of proxies) {
                try {
                    let proxyUrl = getProxyUrl(targetUrl);
                    let res = await fetchWithTimeout(proxyUrl, {}, 4000);
                    return await res.json();
                } catch (e) {
                    // Try next proxy in line
                }
            }
            throw new Error("All proxies failed");
        }

        async function fetchData() {
            if (isRunning) return;
            isRunning = true;

            let lines = [];
            lines.push("=== INDONESIA ECONOMY WATCH ===");
            lines.push(new Date().toLocaleString() + " WIB");
            lines.push("--------------------------------");
            lines.push("INDICES:");

            try {
                let json = await fetchWithProxies('https://www.idxchannel.com/api/saham/index/choices');
                json.data.index.forEach(item => {
                    let sign = item.color === 'green' ? '+' : '-';
                    let code = item.code.padEnd(12);
                    let close = item.close.padEnd(10);
                    lines.push(`${code} : ${close} (${sign}${item.change}, ${sign}${item.change_percentage}%)`);
                });
            } catch (e) {
                lines.push("Error loading indices data.");
            }

            lines.push("--------------------------------");
            lines.push("CURRENCIES:");

            try {
                let json = await fetchWithProxies('https://www.idxchannel.com/api/saham/currency/choices');
                json.data.index.forEach(item => {
                    let code = item.name.padEnd(6);
                    lines.push(`${code} : Rp ${item.close}`);
                });
            } catch (e) {
                lines.push("Error loading currency data.");
            }

            let terminal = document.getElementById('terminal');
            await typeWriter(terminal, lines, 10);
            isRunning = false;
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
