<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheerpJ Minecraft b1.6.6 Server PoC</title>
    <!-- Load CheerpJ runtime loader -->
    <script src="https://cjrtnc.leaningtech.com/v3/loader.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #00ff66;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }
        h1 { color: #4ec9b0; }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
        }
        button:hover { background-color: #1177bb; }
        button:disabled { background-color: #444; cursor: not-allowed; }
        pre {
            background-color: #0a0a0a;
            padding: 15px;
            border: 1px solid #222;
            border-radius: 4px;
            height: 300px;
            overflow-y: scroll;
            color: #d4d4d4;
            font-size: 13px;
        }
        .highlight { color: #ce9178; }
    </style>
</head>
<body>

    <h1>CheerpJ b1.6.6 Server Instance</h1>
    <p>Running a Java Virtual Machine via WebAssembly on a static host, backed by Service Worker caching.</p>

    <div class="card">
        <h2>Execution Controller</h2>
        <p>Status: <span id="cj-status" class="highlight">Registering Service Worker & JVM...</span></p>
        <button id="start-btn" onclick="startMinecraftServer()" disabled>Boot minecraft_server.jar</button>
    </div>

    <div class="card">
        <h2>Virtual Terminal Output (Stdout)</h2>
        <pre id="console-log">[SYSTEM] Initializing environment...</pre>
    </div>

    <script>
        const logElement = document.getElementById('console-log');
        
        function appendLog(text) {
            logElement.textContent += "\n" + text;
            logElement.scrollTop = logElement.scrollHeight;
        }

        // Register Service Worker for caching dynamic CheerpJ CDN chunks & local jar
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => appendLog("[SYSTEM] Service Worker registered successfully."))
                .catch(err => appendLog("[ERROR] SW registration failed: " + err.message));
        }

        // Initialize CheerpJ environment
        async function initEnvironment() {
            try {
                await cheerpjInit();
                document.getElementById('cj-status').textContent = "Ready to Boot";
                document.getElementById('start-btn').disabled = false;
                appendLog("[SYSTEM] CheerpJ WebAssembly JVM runtime initialized.");
            } catch (err) {
                document.getElementById('cj-status').textContent = "Initialization Failed";
                appendLog("[ERROR] CheerpJ failed to load: " + err.message);
            }
        }

        window.addEventListener('DOMContentLoaded', initEnvironment);

        async function startMinecraftServer() {
            document.getElementById('cj-status').textContent = "Running Server...";
            appendLog("[SYSTEM] Mounting virtual file system and executing jar...");

            try {
                // Runs the main method of the b1.6.6 server jar inside the browser sandbox
                await cheerpjRunMain(
                    "net.minecraft.server.MinecraftServer", 
                    "/app/minecraft_server.jar", 
                    "nogui"
                );
                appendLog("[SYSTEM] Server process exited.");
            } catch (err) {
                appendLog("[JAVA RUNTIME EXCEPTION]: " + err.message);
            }
        }
    </script>
</body>
</html>
