<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SW HTTP/1.1 Server Sandbox</title>
</head>
<body>

    <h1>SW HTTP/1.1 Mock Server Sandbox</h1>
    <p>Status: <span id="status">Checking...</span></p>

    <div>
        <button id="btn-start">Register SW Server</button>
        <button id="btn-stop">Unregister SW</button>
        <button id="btn-test">Test HTTP Request</button>
    </div>

    <hr>

    <h3>Target HTML to Serve</h3>
    <textarea id="html-payload" rows="10" cols="80"><h1>Hello from real file SW!</h1></textarea>
    <br><br>
    <button id="btn-update">Update Content</button>

    <h3>Live Server Console</h3>
    <div id="console" style="border: 1px solid black; height: 150px; overflow-y: scroll; padding: 5px;"></div>

    <h3>Live Preview</h3>
    <iframe id="preview-frame" src="about:blank" width="100%" height="200px" style="border: 1px solid black;"></iframe>

    <script>
        const logEl = document.getElementById('console');
        const statusEl = document.getElementById('status');
        const iframe = document.getElementById('preview-frame');

        function log(msg) {
            logEl.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function registerSW() {
            try {
                await navigator.serviceWorker.register('./sw.js', { scope: './' });
                log('[*] SW registered successfully.');
                statusEl.innerText = 'Active';
                updateServerPayload();
            } catch (err) {
                log('[!] Failed: ' + err.message);
            }
        }

        async function unregisterSW() {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let reg of regs) await reg.unregister();
            log('[-] SW unregistered.');
            statusEl.innerText = 'Stopped';
        }

        function updateServerPayload() {
            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    type: 'UPDATE_CONTENT',
                    payload: document.getElementById('html-payload').value
                });
                log('[*] Content updated.');
            }
        }

        navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data?.type === 'HTTP_LOG') {
                log(`[HTTP/1.1] ${event.data.method} ${event.data.url}`);
            }
        });

        document.getElementById('btn-start').onclick = registerSW;
        document.getElementById('btn-stop').onclick = unregisterSW;
        document.getElementById('btn-update').onclick = updateServerPayload;
        document.getElementById('btn-test').onclick = () => {
            iframe.src = '/virtual-server?' + Date.now();
        };

        navigator.serviceWorker.getRegistration().then(reg => {
            statusEl.innerText = reg ? 'Active' : 'Not Running';
        });
    </script>
</body>
</html>
